services:
  - type: web
    name: vivian-bot
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_VISION_MODEL
        sync: false
      - key: GEMINI_MODERATION_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-lite-tts
      - key: PUBLIC_SITE_URL
        value: https://esil.life
