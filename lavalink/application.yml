server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: ${LAVALINK_SERVER_PASSWORD:change-this-password}
    sources:
      # YouTube is provided by youtube-source below. The embedded source must be off.
      youtube: false
      soundcloud: true
      bandcamp: false
      twitch: false
      vimeo: false
      http: true
      local: false
    filters:
      volume: true
    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 50
    playerUpdateInterval: 5
    soundcloudSearchEnabled: true
    gc-warnings: true
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
