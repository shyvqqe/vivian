[package]
name = "vivian-rust"
version = "0.1.0"
edition = "2021"
description = "Vivian Discord bot core for Rust with AI providers and Lavalink 4.2.2"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
dashmap = "6"
dotenvy = "0.15"
futures-util = "0.3"
gif = "0.13"
html-escape = "0.2"
hmac = "0.12"
lavalink-rs = { version = "0.15.0", features = ["serenity", "songbird"] }
poise = "0.7.1"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend", "utils"] }
songbird = { version = "0.5.0", default-features = false, features = ["gateway", "serenity", "rustls", "tungstenite"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

